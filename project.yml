name: clutter
options:
  bundleIdPrefix: com.raideteam
  deploymentTarget:
    iOS: "26.0"
targets:
  clutter:
    type: application
    platform: iOS
    sources: [clutter]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.raideteam.clutter
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: ZP3NWMNL5K
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: clutter
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "clutter needs full access to your photos to show them, add them to albums and delete the ones you choose. nothing leaves your iphone."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
